name: CI-CD AWS ECR

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- BACKEND ----------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements-dev.txt

      - name: Lint backend
        working-directory: ./backend
        run: flake8 . --max-line-length=120 --exclude=migrations,__pycache__

      - name: Test backend
        working-directory: ./backend
        run: pytest

      # ---------------- FRONTEND ----------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint


  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::117407498588:role/GitHubActions-ECR-Deploy-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------- BACKEND IMAGE ----------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            117407498588.dkr.ecr.ap-south-1.amazonaws.com/full-stack-devops-backend:latest
            117407498588.dkr.ecr.ap-south-1.amazonaws.com/full-stack-devops-backend:${{ github.sha }}

      # ---------------- FRONTEND IMAGE ----------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            117407498588.dkr.ecr.ap-south-1.amazonaws.com/full-stack-devops-frontend:latest
            117407498588.dkr.ecr.ap-south-1.amazonaws.com/full-stack-devops-frontend:${{ github.sha }}